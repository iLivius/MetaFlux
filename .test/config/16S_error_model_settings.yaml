# Dry-run config of the CI matrix: 16S, method sintax, SILVA 144, with the settings of
# DADA2's error learning written the way a user might type them, which the start-up
# checks must accept and normalise: max_consist as text ("200" -> 200), the early stop
# switched off (max_flat_rounds: 0), the error function in capitals with spaces
# (" LOESS " -> loess), and one accepted model code as text instead of a list, with the
# md5 characters in capitals ("R2:0A55BE94" -> ["R2:0a55be94"]). The dry run plans the
# run; it does not run the choice of error function, which needs filtered reads.
# Only the keys that differ from the template config/config.yaml are set here; Snakemake
# loads the template first and this file on top of it. Paths are relative to the
# repository root, where snakemake is started. A dry run creates nothing: out_dir and
# refdb_root never come into being. See .test/README.md.
mode: amplicon
input:
  fastq_dir: .test/data/16S
output:
  out_dir: .test/out/16S_error_model_settings
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: 16S
  primers:
    fwd: .test/primers/16S/fwd_primer.fasta
    rev: .test/primers/16S/rev_primer.fasta
  taxonomy:
    method: sintax
    filter:
      keep: [d__Bacteria, d__Archaea]
      discard: [o__Chloroplast, f__Mitochondria]
  dada2:
    learn_errors:
      max_consist: "200"
      max_flat_rounds: 0
      error_model: " LOESS "
      accept_unconverged: "R2:0A55BE94"
