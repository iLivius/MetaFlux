# Dry-run config of the CI matrix: 16S, method rdp, SILVA 144 (the default release).
# Only the keys that differ from the template config/config.yaml are set here; Snakemake
# loads the template first and this file on top of it. Paths are relative to the
# repository root, where snakemake is started. A dry run creates nothing: out_dir and
# refdb_root never come into being. See .test/README.md.
mode: amplicon
input:
  fastq_dir: .test/data/16S
output:
  out_dir: .test/out/16S_rdp_silva144
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: 16S
  primers:
    fwd: .test/primers/16S/fwd_primer.fasta
    rev: .test/primers/16S/rev_primer.fasta
  taxonomy:
    method: rdp
    filter:
      keep: [d__Bacteria, d__Archaea]
      discard: [o__Chloroplast, f__Mitochondria]
