# Dry-run config of the CI matrix that MUST STOP at start-up: an instrument name
# (novaseq) as the error function of DADA2's error learning. The setting takes auto or
# the name of an error function; the kind of quality values is read from the reads,
# never from an instrument name. The runner (.test/run_dry_runs.sh) expects the message
# fragment on the next line.
# EXPECT: error_model must be one of auto, loess, binned, scam
mode: amplicon
input:
  fastq_dir: .test/data/16S
output:
  out_dir: .test/out/expected_stop_16S_error_model_word
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: 16S
  primers:
    fwd: .test/primers/16S/fwd_primer.fasta
    rev: .test/primers/16S/rev_primer.fasta
  taxonomy:
    method: sintax
    filter:
      keep: [d__Bacteria, d__Archaea]
      discard: [o__Chloroplast, f__Mitochondria]
  dada2:
    learn_errors:
      error_model: novaseq
