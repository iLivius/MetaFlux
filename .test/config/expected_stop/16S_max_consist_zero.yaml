# Dry-run config of the CI matrix that MUST STOP at start-up: a cap of 0 rounds on
# DADA2's error learning. With 0 or less, DADA2 hands back its rough starting estimate
# as the model and the run denoises with it, so MetaFlux refuses the value. The runner
# (.test/run_dry_runs.sh) expects the message fragment on the next line.
# EXPECT: max_consist must be a whole number of at least 1
mode: amplicon
input:
  fastq_dir: .test/data/16S
output:
  out_dir: .test/out/expected_stop_16S_max_consist_zero
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: 16S
  primers:
    fwd: .test/primers/16S/fwd_primer.fasta
    rev: .test/primers/16S/rev_primer.fasta
  taxonomy:
    method: sintax
    filter:
      keep: [d__Bacteria, d__Archaea]
      discard: [o__Chloroplast, f__Mitochondria]
  dada2:
    learn_errors:
      max_consist: 0
