# Dry-run config of the CI matrix that MUST STOP at start-up: a fraction (2.5) as the
# number of flat rounds after which the error learning ends early. MetaFlux refuses it
# rather than cut it down to a whole number without a word. The runner
# (.test/run_dry_runs.sh) expects the message fragment on the next line.
# EXPECT: max_flat_rounds must be a whole number >= 0
mode: amplicon
input:
  fastq_dir: .test/data/16S
output:
  out_dir: .test/out/expected_stop_16S_max_flat_rounds_fraction
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: 16S
  primers:
    fwd: .test/primers/16S/fwd_primer.fasta
    rev: .test/primers/16S/rev_primer.fasta
  taxonomy:
    method: sintax
    filter:
      keep: [d__Bacteria, d__Archaea]
      discard: [o__Chloroplast, f__Mitochondria]
  dada2:
    learn_errors:
      max_flat_rounds: 2.5
