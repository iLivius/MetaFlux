# Dry-run config of the CI matrix that MUST STOP at start-up: a run config with two
# amplicon: blocks, as after a user pastes the line a MetaFlux message asks for (here
# error_model: loess) as a new amplicon: block at the end of the file. YAML keeps only
# the last of the two blocks without a word, so every amplicon setting of the first
# (the marker, the primers, the taxonomy filter) would fall back to the template.
# MetaFlux must stop and name the file, the key and the two lines. The runner
# (.test/run_dry_runs.sh) expects the message fragment on the next line.
# EXPECT: the key 'amplicon' is written twice in the same block (lines 18 and 29)
mode: amplicon
input:
  fastq_dir: .test/data/16S
output:
  out_dir: .test/out/expected_stop_16S_two_amplicon_blocks
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: 16S
  primers:
    fwd: .test/primers/16S/fwd_primer.fasta
    rev: .test/primers/16S/rev_primer.fasta
  taxonomy:
    method: sintax
    filter:
      keep: [d__Bacteria, d__Archaea]
      discard: [o__Chloroplast, f__Mitochondria]
# Pasted below the first block instead of inside it:
amplicon:
  dada2:
    learn_errors:
      error_model: loess
