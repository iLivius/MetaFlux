# Dry-run config of the CI matrix that MUST STOP at start-up: a learn_errors: block whose
# only line is commented out, as it is after a user comments out the accept_unconverged
# line the stop message of check_error_model told them to add. YAML reads such a block
# as empty (null), and Snakemake's merge then replaces the template's whole
# learn_errors block with it, losing nbases and the other values under it. MetaFlux
# must stop with a message that names the block, not with a bare Python error. The
# runner (.test/run_dry_runs.sh) expects the message fragment on the next line.
# EXPECT: amplicon.dada2.learn_errors is empty in your run config
mode: amplicon
input:
  fastq_dir: .test/data/16S
output:
  out_dir: .test/out/expected_stop_16S_learn_errors_block_empty
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: 16S
  primers:
    fwd: .test/primers/16S/fwd_primer.fasta
    rev: .test/primers/16S/rev_primer.fasta
  taxonomy:
    method: sintax
    filter:
      keep: [d__Bacteria, d__Archaea]
      discard: [o__Chloroplast, f__Mitochondria]
  dada2:
    learn_errors:
      # accept_unconverged: ["R2:0a55be94"]
