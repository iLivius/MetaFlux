# Dry-run config of the CI matrix: rpoB, method rdp (the only method for this marker), fixed amplicon length and truncation.
# Only the keys that differ from the template config/config.yaml are set here; Snakemake
# loads the template first and this file on top of it. Paths are relative to the
# repository root, where snakemake is started. A dry run creates nothing: out_dir and
# refdb_root never come into being. See .test/README.md.
mode: amplicon
input:
  fastq_dir: .test/data/rpoB
output:
  out_dir: .test/out/rpoB_rdp
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: rpoB
  primers:
    fwd: .test/primers/rpoB/fwd_primer.fasta
    rev: .test/primers/rpoB/rev_primer.fasta
  expected_length: 387
  trunc_len:
    mode: manual
    manual_r1: 250
    manual_r2: 200
  length_filter:
    mode: manual
    range: [355, 420]
  extraction:
    enabled: false
  taxonomy:
    method: rdp
    filter:
      keep: []
      discard: []
