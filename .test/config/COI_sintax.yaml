# Dry-run config of the CI matrix: COI, method sintax (MIDORI2 taxonomy; no region
# extractor, no rdp training set). Only the keys that differ from the template
# config/config.yaml are set here; Snakemake loads the template first and this file on
# top of it. Paths are relative to the repository root, where snakemake is started. A
# dry run creates nothing: out_dir and refdb_root never come into being. See
# .test/README.md.
# Data: 300 read pairs each of two slices of the BF3/BR2 run of the Elbrecht et al. 2019
# insect mock (SRR8082166). In that library R1 carries BR2, hence orientation: mixed.
mode: amplicon
input:
  fastq_dir: .test/data/COI
output:
  out_dir: .test/out/COI_sintax
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: COI
  primers:
    fwd: .test/primers/COI/fwd_primer.fasta
    rev: .test/primers/COI/rev_primer.fasta
    orientation: mixed
  extraction:
    enabled: false
  taxonomy:
    method: sintax
    filter:
      keep: [k__Metazoa]
      discard: []
