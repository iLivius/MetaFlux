# Dry-run config of the CI matrix: ITS (ITS2 region), method rdp, with the ITSx extractor.
# Only the keys that differ from the template config/config.yaml are set here; Snakemake
# loads the template first and this file on top of it. Paths are relative to the
# repository root, where snakemake is started. A dry run creates nothing: out_dir and
# refdb_root never come into being. See .test/README.md.
mode: amplicon
input:
  fastq_dir: .test/data/ITS
output:
  out_dir: .test/out/ITS_rdp
references:
  refdb_root: .test/refdb
  phix:
    fasta: .test/refdb/phix/phix.fna
amplicon:
  type: ITS
  its_region: ITS2
  primers:
    fwd: .test/primers/ITS/fwd_primer.fasta
    rev: .test/primers/ITS/rev_primer.fasta
  taxonomy:
    method: rdp
    filter:
      keep: [k__Fungi]
      discard: []
