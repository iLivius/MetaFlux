# ═══════════════════════════════════════════════════════════════════════
# MetaFlux v2.1.0 — Unified Illumina multi-marker amplicon and shotgun taxonomic profiling workflow
# ═══════════════════════════════════════════════════════════════════════
# TEMPLATE configuration. Replace every `/path/to/...` placeholder with a real path,
# choose a `mode`, and set the references that mode needs. A convenient pattern is to
# copy this file to `config/config.local.yaml` (git-ignored) and run with
# `--configfile config/config.local.yaml`.
#
# All paths can be absolute or relative to the directory snakemake is invoked from.
# Each section is annotated with the mode that consumes it:
#   [shared]   — used by both modes
#   [amplicon] — only used when mode: amplicon
#   [shotgun]  — only used when mode: shotgun

# ┌────────────────────────────────────────────────────────────────────┐
# │ WHAT THIS RUN IS — the four lines that define the analysis.        │
# │   mode          : amplicon | shotgun              (below)          │
# │   amplicon.type : 16S | ITS | 18S | gyrB | rpoB   (amplicon block) │
# │   input.fastq_dir / output.out_dir                (below)          │
# │ Everything else in this file is tuning and can usually stay.       │
# └────────────────────────────────────────────────────────────────────┘

# ─────────────────────── Mode selection ─────────────────────────
# Selects which set of rules runs — amplicon or shotgun (chosen here, not auto-detected).
# Amplicon path requires primer FASTAs (see amplicon.primers); shotgun path
# supports BioProject SRA fetch + arbitrary host genome decontamination.
mode: amplicon # amplicon | shotgun

# ─────────────────────── Input [shared] ─────────────────────────
input:
  # Local FASTQ dir.
  # Amplicon: filenames must match {sample}_R1.fastq.gz / {sample}_R2.fastq.gz.
  # Shotgun:  {sample}_R1/_R2 OR {sample}_1/_2 (SRA-style) — auto-detected.
  fastq_dir: /path/to/fastq_dir
  # BioProject SRA fetch [shotgun-only].
  # Set bioproject to an NCBI BioProject accession (e.g. PRJNA603575) and
  # MetaFlux will resolve PAIRED runs via NCBI e-utils and pull them into
  # fastq_dir via prefetch + fasterq-dump. Leave null to use local FASTQs.
  bioproject: null  # e.g. PRJNA603575
  accession_list: null # optional subset, e.g. [SRR11605259, SRR11605260]

# ─────────────────────── Output [shared] ────────────────────────
output:
  out_dir: /path/to/output_dir

# ─────────────────────── References ─────────────────────────────
# PhiX is used in both modes but consumed differently:
#   amplicon → bowtie2 index built from the fetched FASTA
#   shotgun  → BBDuk's bundled phix174_ill.ref.fa.gz (no download/index needed)
# kraken_db is shotgun-only and must be supplied separately.
references:
  # Marker reference databases (SILVA / UNITE / PR2 / SILVA-Euk / DD7RZ8 / FROGS) are
  # NOT listed here. Each marker pack (workflow/markers/<type>.yaml) declares its own
  # DB filenames and download URLs, and MetaFlux fetches them on first use into
  # refdb_root. An entry here is only needed to RELOCATE one, e.g.
  #     silva: {train: /shared/dbs/silva_nr99_v138.2_toGenus_trainset.fa.gz}
  refdb_root: refdb            # where fetched databases are cached

  phix: # [shared] — used by both modes; amplicon also builds a bowtie2 index
    fasta: refdb/phix/phix.fna
    fetch_url: ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/819/615/GCF_000819615.1_ViralProj14015/GCF_000819615.1_ViralProj14015_genomic.fna.gz

  kraken_db: /path/to/kraken2_db # [shotgun] — user-supplied (e.g. a PlusPF index)

# ═══════════════════════════════════════════════════════════════
# Amplicon-only configuration — ignored when mode: shotgun
# ═══════════════════════════════════════════════════════════════
amplicon:
  type: 16S                                   # 16S | ITS | 18S | gyrB | rpoB
                                              # 18S: probed on SILVA-Euk, classified on PR2;
                                              # no region extractor (extraction is forced off).
                                              # gyrB: probed direct (DD7RZ8 is pre-trimmed);
                                              # rpoB: probed by in-silico PCR (FROGS is full-length).
                                              # Both gyrB/rpoB are rdp-only (no SINTAX build) and
                                              # have no region extractor (extraction is forced off).
                                              # Remember to set taxonomy.filter for the marker
                                              # (18S: keep [d__Eukaryota]).
  its_region: ITS2                            # ITS1 | ITS2 (ignored unless type == ITS)

  # Fixes the RNG for every stochastic step in the amplicon path: DADA2
  # learnErrors(randomize=TRUE) and DADA2 assignTaxonomy's bootstrap
  # confidence (rdp) are FULLY reproducible with this seed, at any thread
  # count — verified empirically (identical output at 8 threads, two runs).
  # VSEARCH --sintax's bootstrap confidence (sintax) is NOT: vsearch races
  # multiple threads on one RNG stream during sintax, so a handful of
  # per-rank confidence values can still drift between runs even with this
  # seed fixed — verified empirically (8 threads: differs; 1 thread:
  # identical). For byte-reproducible sintax output, set
  # resources.threads.assign_taxonomy: 1 (slower). See README Troubleshooting.
  seed: 42

  decontamination:
    remove_phix: true                         # bowtie2 vs the fetched PhiX reference; false = skip PhiX removal
                                              # (symmetric with shotgun.decontamination.remove_phix)

  primers:
    fwd: /path/to/fwd_primer.fasta
    rev: /path/to/rev_primer.fasta
    orientation: fixed                        # fixed | mixed (mixed enables swap pass in cutadapt)

  expected_length: auto                       # int | [min,max] | "auto"
                                              # 16S auto: in-silico PCR against SILVA; uses probe_length_stat.16S.
                                              # ITS auto: length distribution of UNITE UCHIME ITS1/ITS2 sequences.
                                              # 18S auto: in-silico PCR against SILVA-Euk; uses probe_length_stat.18S.
                                              #   V4 primers (TAReuk/Bass/Parfrey/Hadziavdic, 515Y-926R) work with
                                              #   auto — the window is wide (measured 380-595 bp core, primer-dependent).
                                              #   V9 (1391F/EukBr) must be MANUAL, e.g. [115, 150]: only 24-41% of
                                              #   references are recovered in silico (EukBr sits at the 3' terminus and
                                              #   most references are truncated before it), so auto would size the
                                              #   window from a biased minority.
                                              # gyrB auto: direct read of the pre-trimmed DD7RZ8 amplicons; uses
                                              #   probe_length_stat.16S (gyrB reuses that key — its own is unused
                                              #   since the direct path never runs an in-silico PCR).
                                              # rpoB auto: in-silico PCR against the full-length FROGS genes; uses
                                              #   probe_length_stat.rpoB — this key MUST be present in auto mode or
                                              #   parsing hard-errors.
                                              # Manual: provide a single integer (bp) or [min, max] range.
  probe_length_stat:
    16S: p95                                  # min | q1 | median | q3 | p95 | p99 | max
    18S: p95                                  # 18S V4 has a ragged upper tail — p95 keeps the overlap constraint permissive
    rpoB: p95                                 # required whenever rpoB runs, auto or not
                                              # ITS: overlap constraint not checked (truncLen overridden to c(0,0))
  min_overlap: 12                             # design overlap in bp — truncLen constraint ONLY
                                              # (runtime mergePairs uses dada2.merge.min_overlap)

  cutadapt:
    max_error_rate: 0.2
    min_length: 50
    # No quality trimming at this stage — DADA2 wants per-cycle Q profiles intact.

  trunc_len:
    mode: auto                                # auto | manual
    q_threshold: 20                           # Q1 (25th-percentile) cutoff for auto
    q_floor: 15                               # floor used by relax_q resolve_policy
    resolve_policy: raise_trunc               # raise_trunc | relax_q | error
    subsample_files: 12                       # number of files sampled by dada2::qa() per direction
    manual_r1: #260                           # used only when mode == manual
    manual_r2: #240
    min_read_coverage_pct: 95                 # auto mode only: a cut is never placed past the
                                              # length this % of a sample's reads still reach.
                                              # DADA2 DISCARDS reads shorter than truncLen, so a
                                              # cut above the read-length bulk loses the library,
                                              # not just a few bases. Falco reports quality up to
                                              # the LONGEST read in a file, which on a clean run
                                              # is what the cut would otherwise follow.
                                              # Direction: HIGHER is stricter and gives a SHORTER
                                              # cut (more reads survive); lower gives a longer cut
                                              # and discards more short reads. Do NOT set 100 --
                                              # it demands that every read reach the cut, so the
                                              # ceiling collapses to the single shortest read in
                                              # the file (79 bp on the 18S test set). There is no
                                              # value that switches the guard off.
    # 16S, 18S, gyrB and rpoB all use the same Q-based picker + overlap constraint.
    # ITS is the one exception: truncLen is overridden to (0, 0) in filterAndTrim —
    # no hard cut is applied; quality is controlled by maxEE and min_len only.

  # ASV length filter applied AFTER target extraction (Metaxa2/ITSx) so the
  # filtered distribution is directly comparable to the probe distribution.
  # Auto window: [probe_q1 − window_margin, probe_p95 + window_margin].
  length_filter:
    mode: auto                                # auto | manual
    window_margin: 50                         # bp added/subtracted from probe q1 (lower) and p95 (upper)
    range: null                               # [min, max] — overrides auto when set; required when mode=manual

  extraction:
    enabled: true                             # Metaxa2 (16S) or ITSx (ITS); set false to skip
                                              # 18S/gyrB/rpoB have NO region extractor — set false
                                              # for these (left true is auto-forced off with a warning)

  taxonomy:
    method: sintax                            # rdp | sintax
    min_boot: 80                              # rdp only  — RDP bootstrap minimum (0–100)
    sintax_cutoff: 0.8                        # sintax only — confidence threshold (0–1); 0.8 ≈ min_boot=80
    try_rc: true                              # rdp only  — try reverse complement during assignTaxonomy
    filter:
      enabled: true                           # master switch; false = keep every ASV
      # Contaminant filter as rank-aware TOKEN LISTS. Each token is matched against
      # a whole segment of the taxonomy string (k__Bacteria, o__Chloroplast,
      # g__Ralstonia, …), so it targets exactly one rank — never a loose substring.
      # `keep` runs first (defines what survives); then `discard` prunes what's left.
      # An empty list [] means that direction does nothing. There is NO built-in
      # default — whatever you list here is exactly what is applied, so set these to
      # match your marker.
      #
      # The values below are COMMENTED OUT on purpose. This file is always loaded as a
      # base layer beneath your --configfile, so a concrete value here would silently
      # apply to any run that does not set its own (e.g. 16S taxon strings leaking into
      # an 18S run, which would discard every eukaryotic ASV). Left unset they resolve
      # to [] = no filtering, which fails safe. Copy the line for your marker into YOUR
      # run config and uncomment it there.
      #
      # Recommended starting points:
      #   16S  : keep [k__Bacteria, k__Archaea]   discard [o__Chloroplast, f__Mitochondria]
      #   ITS  : keep [k__Fungi]                  discard []
      #   18S  : keep [d__Eukaryota]              discard []   # PR2 ranks (d__);
      #                                                        # use k__Eukaryota with SILVA-Euk
      #   gyrB : no recommended default — the DD7RZ8 paralog tag (discard: [other])
      #          is a separate, structural filter; see README "Running gyrB"
      #   rpoB : no recommended default — FROGS RefSeq has no non-rpoB contamination
      #          equivalent to filter; leave empty unless your own run shows otherwise
      # To drop lab/kit contaminants a blank control revealed, add them to discard,
      # e.g. discard: [o__Chloroplast, f__Mitochondria, g__Ralstonia, g__Bradyrhizobium]
      keep:    #[k__Bacteria, k__Archaea]
      discard: #[o__Chloroplast, f__Mitochondria]

  dada2:
    pool: false                               # false | "pseudo" | true

    # ── Tier 1: operational parameters ──
    max_ee: [2, 5]                            # filterAndTrim maxEE [R1, R2]
    trunc_q: 2                                # filterAndTrim truncQ — adaptive 3' trim at first base <= this Q (DADA2 default)
    filter:
      min_len: 20                             # per-read length floor; 20 is DADA2's own filterAndTrim default
      # ITS-only, opt-in: derive min_len from the probe distribution instead
      # (min|q1|median|q3|p95|p99|max). Left null, every marker uses min_len above.
      # Setting q1 puts the floor near 175 bp, above ~24% of the UNITE reference
      # (ITS1 bottoms out at 17 bp, ITS2 at 38), which discards genuinely short
      # fungal amplicons — the bias truncLen: c(0,0) exists to avoid. See the ITS page.
      min_len_stat: null
      max_len: null                           # null = no upper length filter (Inf)

    learn_errors:
      nbases: 1e8                             # bases sampled for error model (1e8 = DADA2 default)
      max_consist: 999                        # max EM iterations (999 ≈ unlimited)

    # ── Tier 2: advanced tuning ──
    dada:
      omega_a: 1e-40                          # ASV inference sensitivity (DADA2 default); lower = stricter = fewer ASVs

    merge:
      min_overlap: 12                         # runtime mergePairs threshold in bp = DADA2 default
                                              # (the design constraint is amplicon.min_overlap)
      max_mismatch: 0                         # DADA2 default. Zero is deliberate: after denoising,
                                              # a mismatch in the overlap is evidence the pair should
                                              # not be merged rather than a sequencing error.
      just_concatenate: false                 # joins EVERY pair with an N spacer and never merges on
                                              # overlap — not a selective rescue; see the ITS page
      trim_overhang: true                     # trim bases overhanging amplicon ends; safe for 16S, necessary for short ITS

    chimera:
      method: consensus
      min_fold_parent: 4
      allow_one_off: false                    # DADA2 default. FALSE means STRICTER, not looser: a
                                              # sequence one mismatch/indel away from an exact bimera
                                              # gets flagged as chimeric too, on top of exact matches.
                                              # Setting this true is the relaxed direction — it keeps
                                              # those near-miss sequences instead of removing them.

# ═══════════════════════════════════════════════════════════════
# Shotgun-only configuration — ignored when mode: amplicon
# ═══════════════════════════════════════════════════════════════
shotgun:
  decontamination:
    # PhiX is still routinely spiked into Illumina runs — keep this on unless the
    # lab is known to have skipped the spike-in.
    remove_phix: true                         # BBDuk vs bundled phix174_ill.ref.fa.gz; false = skip

    # Host / contaminant removal with BBMap (alignment-based — more sensitive than
    # k-mer matching for host reads that diverge from the reference assembly; this
    # is the BBTools-authors' recommended approach, cf. removehuman.sh).
    # host_genomes: list of local paths and/or URLs to FASTA(.gz) references;
    # multiple entries are concatenated and indexed once. Empty list → skip.
    #
    # For HUMAN, use a MASKED reference — masking ribosomal/low-complexity regions
    # and sequences homologous to microbes/plants/fungi prevents real microbial
    # reads from being falsely removed. A masked human genome (Handley 2020, hg19 +
    # viral masking, 889 MB) is on Zenodo:
    #   https://zenodo.org/records/4116107   →   human_virus_masked.fasta.gz
    # Because it is ~900 MB, download it once to a local path rather than
    # re-fetching the URL on every fresh run.
    host_genomes: []                          # e.g. [/path/to/human_virus_masked.fasta.gz]; [] = skip
    #   - https://zenodo.org/records/4116107/files/human_virus_masked.fasta.gz     # masked human (889 MB) — see README
    #   - /path/to/human_virus_masked.fasta.gz                                                # local alternative (recommended for repeat runs)
    host_min_id: 0.95                         # BBMap minid — approximate minimum alignment identity for host removal

  fastp:
    min_read_length: 100                      # --length_required after trimming
                                              # 100 is comfortable for 150 bp reads; ~70 for HiSeq 2x100.

  # Kraken2 confidence threshold — higher = stricter.
  # Wright et al. 2023 swept 0.00–1.00 on simulated samples and found two optima,
  # depending on the metric: 0.60 by mean F1, and 0.15 by L1 distance, weighted
  # UniFrac, and recall/precision over the reads actually classified. 0.15 is also
  # what Nyström-Persson et al. 2025 used to benchmark on the CAMI2 datasets.
  # 0.15 (below) favours accurate relative abundances over raw classified counts.
  kraken:
    confidence: 0.15
    hit_groups: 3                             # minimum distinct hit groups per read to keep a classification
    # Two memory-control strategies (only one applies at runtime):
    #   1. mmap on  — kernel pages the DB on demand AND shares pages across
    #                 concurrent kraken2 processes via the OS file cache.
    #                 Parallel jobs do NOT multiply RAM use. Per-process budget
    #                 is fixed at ~20 GB (computed in 00_common.smk).
    #   2. mmap off — each process privately loads the full hash. Per-process
    #                 budget = hash.k2d size + 10% (computed in 00_common.smk).
    memory_mapping: true
    threads: null                             # null = use resources.threads.kraken2; or pin (e.g. 12)

  # Bracken redistributes abundance from Kraken2 reports.
  # Target rank: D | P | C | O | F | G | S. Drop to G for a shallow DB.
  bracken:
    tax_lev: S
    threshold: 10                             # min read count per taxon

  # OTU-table taxon filter — the shotgun counterpart of amplicon.taxonomy.filter.
  # Uses the SAME rank-aware token machinery: each token (k__Bacteria, g__Homo,
  # …) matches a whole segment of the OTU's taxonomy lineage; `keep` runs first,
  # then `discard`. Empty list = that direction does nothing. Applied to the
  # final otu_table after Bracken, so it never changes read classification, only
  # which OTUs appear in the table. Default OFF (metagenomic sample types vary
  # too much for a universal default). Common uses:
  #   keep:    [k__Bacteria, k__Archaea]   # prokaryotes only (drop Eukaryota/Viruses)
  #   discard: [g__Homo]                    # explicit host safety net
  taxonomy_filter:
    enabled: false
    keep:    []
    discard: []

  # NCBI scientific names of taxa whose reads should be extracted via krakentools.
  # Empty list = skip extraction entirely. Example: [Bacteria, Archaea]
  extract_taxa: []

# ─────────────────────── Resources [shared] ─────────────────────
# Per-rule threads and mem_mb. Rules read these via threads_for() / mem_mb_for()
# helpers defined in workflow/rules/shared/00_common.smk. Missing keys fall
# back to threads_default / mem_mb_default.
resources:
  threads_default: 4
  mem_mb_default: 2000
  threads:
    # ── shared ──
    multiqc: 2
    # ── amplicon ──
    falco: 2
    bowtie2: 8
    cutadapt: 4
    pick_trunclen: 4
    dada_quality_plots: 4
    dada_filter: 4
    dada_seqtab: 8
    dada_length_filter: 2
    target_extract: 8
    assign_taxonomy: 8
    aggregate_read_counts: 2
    # ── shotgun ──
    decontam_phix: 6
    build_host_index: 16
    decontam_host: 16
    fastp: 16
    kraken2: 16
    bracken: 4
    kraken_biom: 2
    extract_taxon_reads: 4
    compress_extracted: 6                     # pigz parallelism for extract_taxa outputs
    download_sra: 6                           # fasterq-dump parallelism; past ~8 the bottleneck is I/O, not CPU
  mem_mb:
    # ── shared ──
    multiqc: 2000
    # ── amplicon ──
    bowtie2: 4000
    pick_trunclen: 4000
    dada_quality_plots: 4000
    dada_filter: 2000
    dada_seqtab: 16000
    dada_length_filter: 4000
    target_extract: 8000
    assign_taxonomy: 16000
    aggregate_read_counts: 2000
    # ── shotgun ──
    decontam_phix: 4000
    build_host_index: 30000                   # BBMap index build for the host reference (masked human ~24-28 GB)
    decontam_host: 30000                      # BBMap mapping vs the host index
    fastp: 8000
    # kraken2 mem_mb is OVERRIDDEN at parse time in 00_common.smk based on
    # shotgun.kraken.memory_mapping + actual hash.k2d size. The value here is
    # an inert fallback used only if KRAKEN_DB is unreadable.
    kraken2: 20000
    bracken: 4000
    kraken_biom: 2000
    extract_taxon_reads: 2000
