# ═══════════════════════════════════════════════════════════════════════
# MetaFlux v2.5.0 — Unified short-read multi-marker amplicon and shotgun taxonomic profiling workflow
# ═══════════════════════════════════════════════════════════════════════
# TEMPLATE configuration. Replace every `/path/to/...` placeholder with a real path,
# choose a `mode`, and set the references that mode needs. A convenient pattern is to
# copy this file to `config/config.local.yaml` (git-ignored) and run with
# `--configfile config/config.local.yaml`.
#
# All paths can be absolute or relative to the directory snakemake is invoked from.
# Each section is annotated with the mode that consumes it:
#   [shared]   — used by both modes
#   [amplicon] — only used when mode: amplicon
#   [shotgun]  — only used when mode: shotgun

# ┌────────────────────────────────────────────────────────────────────┐
# │ WHAT THIS RUN IS — the lines that define the analysis.             │
# │   mode             : amplicon | shotgun            (below)         │
# │   amplicon.type    : 16S | ITS | 18S | gyrB | rpoB (amplicon block)│
# │   shotgun.profiler : kraken2 | sylph | both        (shotgun block) │
# │   input.fastq_dir / output.out_dir                 (below)         │
# │ Everything else in this file is tuning and can usually stay.       │
# └────────────────────────────────────────────────────────────────────┘

# ─────────────────────── Mode selection ─────────────────────────
# Selects which set of rules runs — amplicon or shotgun (chosen here, not auto-detected).
# Amplicon path requires primer FASTAs (see amplicon.primers); shotgun path
# supports BioProject SRA fetch + arbitrary host genome decontamination.
mode: amplicon # amplicon | shotgun

# ─────────────────────── Input [shared] ─────────────────────────
input:
  # Local FASTQ dir.
  # Amplicon: filenames must match {sample}_R1.fastq.gz / {sample}_R2.fastq.gz.
  # Shotgun:  {sample}_R1/_R2 OR {sample}_1/_2 (SRA-style) — auto-detected.
  fastq_dir: /path/to/fastq_dir
  # BioProject SRA fetch [shotgun-only].
  # Set bioproject to an NCBI BioProject accession (e.g. PRJNA603575) and
  # MetaFlux will resolve PAIRED runs via NCBI e-utils and pull them into
  # fastq_dir via prefetch + fasterq-dump. Leave null to use local FASTQs.
  bioproject: null  # e.g. PRJNA603575
  accession_list: null # optional subset, e.g. [SRR11605259, SRR11605260]

# ─────────────────────── Output [shared] ────────────────────────
output:
  out_dir: /path/to/output_dir

# ─────────────────────── References ─────────────────────────────
# PhiX is used in both modes but consumed differently:
#   amplicon → bowtie2 index built from the fetched FASTA
#   shotgun  → BBDuk's bundled phix2.fa.gz (no download/index needed)
# kraken_db (shotgun.profiler kraken2 | both) and sylph_databases + sylph_taxonomy_dir
# (shotgun.profiler sylph | both) are shotgun-only and must be supplied separately.
references:
  # Marker reference databases (SILVA / UNITE / PR2 / SILVA-Euk / DD7RZ8 / FROGS) are
  # NOT listed here. Each marker pack (workflow/markers/<type>.yaml) declares its own
  # DB filenames and download URLs, and MetaFlux fetches them on first use into
  # refdb_root. An entry here is needed only to RELOCATE one or, for 16S, to pick
  # the SILVA release (see below), e.g.
  #     silva: {species: /shared/dbs/silva_v144_assignSpecies.fa.gz}
  #
  # 16S ships two SILVA releases: 144 (the default) and 138.2. To run on 138.2, put
  #     silva: {release: "138.2"}
  # in your run config. Each release keeps its own file names under refdb_root, so
  # switching never overwrites the other one's files. (SILVA 144 has a Kingdom rank
  # between Domain and Phylum, and MetaFlux classifies on it like on every other
  # rank: SILVA 144 strings read d__Bacteria;k__Pseudomonadati;p__..., SILVA 138.2
  # strings d__Bacteria;p__.... SILVA 144's "--other" names are a separate matter,
  # set by amplicon.taxonomy.silva_other.)
  refdb_root: refdb            # where fetched databases are cached

  phix: # [shared] — used by both modes; amplicon also builds a bowtie2 index
    fasta: refdb/phix/phix.fna
    fetch_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/819/615/GCF_000819615.1_ViralProj14015/GCF_000819615.1_ViralProj14015_genomic.fna.gz

  kraken_db: /path/to/kraken2_db # [shotgun, profiler kraken2 | both] — user-supplied (e.g. a PlusPF index)

  # [shotgun, profiler sylph | both] — user-supplied, like kraken_db: MetaFlux never
  # downloads these. One entry per sylph database file, each with the sylph-tax
  # taxonomy that names its genomes (or the path of your own accession<TAB>lineage
  # table, .tsv or .tsv.gz):
  #   gtdb-r232-c200-dbv1.syldb                ->  GTDB_r232
  #   gtdb-r226-c200-dbv1.syldb                ->  GTDB_r226
  #   fungi-refseq-2025-10-11-c200-dbv1.syldb  ->  FungiRefSeq-latest
  # GlobDB r226 (GlobDB_r226) is refused at start-up: its lineage table gives 754 genomes
  # no domain. Use GlobDB r232, which places every genome in a domain:
  #   globdb_r232_sylph_c200.syldb             ->  GlobDB_r232 (from the GlobDB website)
  # All databases are profiled in ONE sylph run, so within a sample an organism present
  # in two of them is counted once, by its closer genome. GTDB and GlobDB together are
  # refused at start-up: GlobDB holds every GTDB genome too (under its accession without
  # the version suffix), so each would be loaded twice, sylph could report a genome from
  # either copy, differently per sample, which splits it over two rows, and the run would
  # need more memory (about 26 GB more with GTDB r232 c200). List GlobDB alone (it covers
  # GTDB) or GTDB alone; FungiRefSeq can go with either. Use builds made at c 200 (best
  # for thin communities) or c 1000 (about 5x less memory). A c 100 build cannot be used:
  # MetaFlux sketches the reads at c 200. .syldb and two-stage .syl2db files both work.
  # Memory: sylph holds the files in memory; measured peak 1.01-1.11 x their size on
  # disk (GTDB r232 c200 + fungi: 26.66 GB of files, peak 26.9-29.7 GB).
  # Downloads: https://sylph-docs.github.io/ (page 'Pre-built databases')
  sylph_databases: []
  #  - path: /path/to/gtdb-r232-c200-dbv1.syldb
  #    taxonomy: GTDB_r232
  #  - path: /path/to/fungi-refseq-2025-10-11-c200-dbv1.syldb
  #    taxonomy: FungiRefSeq-latest

  # [shotgun, profiler sylph | both] — folder of sylph-tax lineage tables (~80 MB),
  # filled once with sylph-tax 1.9.2 (the version in workflow/envs/sylph.yaml):
  #   sylph-tax --no-config --taxonomy-dir /path/to/sylph_taxonomy download
  # MetaFlux hands this folder to sylph-tax itself (--no-config --taxonomy-dir), so
  # nothing is read from or written to ~/.config/sylph-tax. Needed whenever a
  # `taxonomy` above is a sylph-tax name rather than a file path.
  sylph_taxonomy_dir: null

# ═══════════════════════════════════════════════════════════════
# Amplicon-only configuration — ignored when mode: shotgun
# ═══════════════════════════════════════════════════════════════
amplicon:
  type: 16S                                   # 16S | ITS | 18S | gyrB | rpoB
                                              # 18S: probed on SILVA-Euk, classified on PR2;
                                              # no region extractor (extraction is forced off).
                                              # gyrB: probed direct (DD7RZ8 is pre-trimmed);
                                              # rpoB: probed by in-silico PCR (FROGS is full-length).
                                              # Both gyrB/rpoB are rdp-only (no SINTAX build) and
                                              # have no region extractor (extraction is forced off).
                                              # Remember to set taxonomy.filter for the marker
                                              # (18S: keep [d__Eukaryota]).
  its_region: ITS2                            # ITS1 | ITS2 (ignored unless type == ITS)

  # Fixes the random number generator for the three amplicon steps that use one:
  #   1. DADA2 learnErrors(randomize=TRUE);
  #   2. the bootstrap confidence of the taxonomy step (VSEARCH --sintax, or
  #      DADA2 assignTaxonomy with method rdp);
  #   3. the tree search, with phylogeny on (see amplicon.phylogeny).
  # With it, steps 1 and 2 give the same result at any thread count, with one
  # exception: assignTaxonomy breaks exact ties between equally good references
  # at random, outside this seed, so with rdp a few bootstrap values can differ
  # between identical runs. Keep it a positive integer: VSEARCH reads 0 as
  # "pick a random seed". See docs/troubleshooting.md.
  seed: 42

  decontamination:
    remove_phix: true                         # bowtie2 vs the fetched PhiX reference; false = skip PhiX removal
                                              # (symmetric with shotgun.decontamination.remove_phix)

  primers:
    fwd: /path/to/fwd_primer.fasta
    rev: /path/to/rev_primer.fasta
    orientation: fixed                        # fixed | mixed (mixed enables swap pass in cutadapt)

  expected_length: auto                       # int | [min,max] | "auto"
                                              # 16S auto: in-silico PCR against SILVA; uses probe_length_stat.16S.
                                              #   Chloroplast, mitochondrial and eukaryote references
                                              #   are left out of the length statistics.
                                              # ITS auto: length distribution of UNITE UCHIME ITS1/ITS2 sequences.
                                              # 18S auto: in-silico PCR against SILVA-Euk; uses probe_length_stat.18S.
                                              #   V4 primers (TAReuk/Bass/Parfrey/Hadziavdic, 515Y-926R) work with
                                              #   auto — the window is wide (measured 380-595 bp core, primer-dependent).
                                              #   V9 (1391F/EukBr) must be MANUAL, e.g. [115, 150]: only 24-41% of
                                              #   references are recovered in silico (EukBr sits at the 3' terminus and
                                              #   most references are truncated before it), so auto would size the
                                              #   window from a biased minority.
                                              # gyrB auto: direct read of the pre-trimmed DD7RZ8 amplicons; uses
                                              #   probe_length_stat.16S (gyrB reuses that key — its own is unused
                                              #   since the direct path never runs an in-silico PCR).
                                              # rpoB auto: in-silico PCR against the full-length FROGS genes; uses
                                              #   probe_length_stat.rpoB — this key MUST be present in auto mode or
                                              #   parsing hard-errors.
                                              # Manual: provide a single integer (bp) or [min, max] range.
  probe_length_stat:
    16S: p95                                  # min | q1 | median | q3 | p95 | p99 | max
    18S: p95                                  # 18S V4 has a ragged upper tail — p95 keeps the overlap constraint permissive
    rpoB: p95                                 # required whenever rpoB runs, auto or not
                                              # ITS: overlap constraint not checked (truncLen overridden to c(0,0))
  min_overlap: 12                             # design overlap in bp — truncLen constraint ONLY
                                              # (runtime mergePairs uses dada2.merge.min_overlap)

  cutadapt:
    max_error_rate: 0.2
    min_length: 50
    # No quality trimming at this stage — DADA2 wants per-cycle Q profiles intact.

  trunc_len:
    mode: auto                                # auto | manual
    q_threshold: 20                           # Q1 (25th-percentile) cutoff for auto
    q_floor: 15                               # floor used by relax_q resolve_policy
    resolve_policy: raise_trunc               # raise_trunc | relax_q | error
    subsample_files: 12                       # number of files sampled by dada2::qa() per direction
    manual_r1: #260                           # used only when mode == manual
    manual_r2: #240
    min_read_coverage_pct: 95                 # auto mode only: a cut is never placed past the
                                              # length this % of a sample's reads still reach.
                                              # DADA2 DISCARDS reads shorter than truncLen, so a
                                              # cut above the read-length bulk loses the library,
                                              # not just a few bases. Falco reports quality up to
                                              # the LONGEST read in a file, which on a clean run
                                              # is what the cut would otherwise follow.
                                              # Direction: HIGHER is stricter and gives a SHORTER
                                              # cut (more reads survive); lower gives a longer cut
                                              # and discards more short reads. Do NOT set 100 --
                                              # it demands that every read reach the cut, so the
                                              # ceiling collapses to the single shortest read in
                                              # the file. There is no value that switches the
                                              # guard off.
    # 16S, 18S, gyrB and rpoB all use the same Q-based picker + overlap constraint.
    # ITS is the one exception: truncLen is overridden to (0, 0) in filterAndTrim —
    # no hard cut is applied; quality is controlled by maxEE and min_len only.

  # ASV length filter applied AFTER target extraction (Metaxa2/ITSx) so the
  # filtered distribution is directly comparable to the probe distribution.
  # Auto window: [probe_q1 − window_margin, probe_p95 + window_margin].
  length_filter:
    mode: auto                                # auto | manual
    window_margin: 50                         # bp added/subtracted from probe q1 (lower) and p95 (upper)
    range: null                               # [min, max] — overrides auto when set; required when mode=manual

  extraction:
    enabled: true                             # Metaxa2 (16S) or ITSx (ITS); set false to skip.
                                              # 16S: false also leaves the organelle filter
                                              # (taxonomy.filter.organelles) without Metaxa2's
                                              # call, so it removes nothing.
                                              # 18S/gyrB/rpoB have NO region extractor — set false
                                              # for these (left true is auto-forced off with a warning)

  taxonomy:
    method: sintax                            # rdp | sintax
    min_boot: 80                              # rdp only  — RDP bootstrap minimum (0–100)
    sintax_cutoff: 0.8                        # sintax only — confidence threshold (0–1); 0.8 ≈ min_boot=80
    try_rc: true                              # rdp only  — try reverse complement during assignTaxonomy
    silva_other: verbatim                     # 16S, SILVA 144 only — verbatim | strip
                                              # SILVA 144 writes "X--other" for a clade that does not
                                              # contain the type of taxon X but is considered part of X
                                              # (e.g. Bacillaceae--other next to Bacillaceae).
                                              #   verbatim: keep the names as SILVA writes them; the
                                              #     filter and addSpecies treat "X--other" as "X".
                                              #   strip: remove the suffix before training, so X and
                                              #     X--other become one taxon.
                                              # The kingdom is always written without the suffix,
                                              # whichever you choose.
    filter:
      enabled: true                           # master switch; false = keep every ASV
      # Contaminant filter as rank-aware TOKEN LISTS. Each token is matched against
      # a whole segment of the taxonomy string (d__Bacteria, o__Chloroplast,
      # g__Ralstonia, …), so it targets exactly one rank — never a loose substring.
      # `keep` runs first (defines what survives); then `discard` prunes what's left.
      # An empty list [] means that direction does nothing. There is NO built-in
      # default — whatever you list here is exactly what is applied, so set these to
      # match your marker.
      #
      # The values below are COMMENTED OUT on purpose. This file is always loaded as a
      # base layer beneath your --configfile, so a concrete value here would silently
      # apply to any run that does not set its own (e.g. 16S taxon strings leaking into
      # an 18S run, which would discard every eukaryotic ASV). Left unset they resolve
      # to [] = no token filtering, which fails safe (on 16S the organelle filter below
      # still removes Metaxa2's mitochondria/chloroplast calls). Copy the line for your
      # marker into YOUR run config and uncomment it there.
      #
      # Recommended starting points:
      #   16S  : keep [d__Bacteria, d__Archaea]   discard [o__Chloroplast, f__Mitochondria]
      #   ITS  : keep [k__Fungi]                  discard []
      #   18S  : keep [d__Eukaryota]              discard []   # PR2 ranks (d__)
      #   gyrB : no recommended default — the DD7RZ8 paralog tag (discard: [other])
      #          is a separate, structural filter; see docs/amplicon/markers/gyrb.md
      #   rpoB : no recommended default — FROGS RefSeq has no non-rpoB contamination
      #          equivalent to filter; leave empty unless your own run shows otherwise
      # To drop lab/kit contaminants a blank control revealed, add them to discard,
      # e.g. discard: [o__Chloroplast, f__Mitochondria, g__Ralstonia, g__Bradyrhizobium]
      keep:    #[d__Bacteria, d__Archaea]
      discard: #[o__Chloroplast, f__Mitochondria]
      # Best-hit check for discard. The reported taxonomy stops at the last rank that
      # reaches min_boot / sintax_cutoff, so an ASV whose best hit is Mitochondria with
      # only 60% support at family level is reported as "p__Pseudomonadota" and would
      # escape f__Mitochondria. With this set, an ASV is also discarded when its best
      # hit carries a discard token at the token's rank with at least this support
      # (percent, 0-100; SINTAX confidence x 100). It does nothing while discard is
      # empty; null switches it off.
      discard_min_support: 50
      # Organelle filter, 16S only: metaxa2 | off. Metaxa2, which already runs as the
      # 16S region extractor, sorts every ASV into one origin (bacteria, archaea,
      # eukaryota, chloroplast, mitochondria, uncertain). With metaxa2, the ASVs it
      # calls mitochondria or chloroplast are removed as well, after keep/discard. This
      # catches plant mitochondria that the classifier reports as bacteria (e.g.
      # Enterobacterales), which no token can reach. Safe to leave set for every
      # marker: it only acts on 16S with extraction enabled, and does nothing (one
      # info line) otherwise. 6.taxonomy/asv_table_unfiltered.txt keeps every ASV,
      # organelles included, whatever this is set to.
      organelles: metaxa2

  dada2:
    pool: false                               # false | "pseudo" | true

    # ── Tier 1: operational parameters ──
    max_ee: [2, 5]                            # filterAndTrim maxEE [R1, R2]
    trunc_q: 2                                # filterAndTrim truncQ — adaptive 3' trim at first base <= this Q (DADA2 default)
    filter:
      min_len: 20                             # per-read length floor; 20 is DADA2's own filterAndTrim default
      # ITS-only, opt-in: derive min_len from the probe distribution instead
      # (min|q1|median|q3|p95|p99|max). Left null, every marker uses min_len above.
      # Setting q1 puts the floor near 175 bp, above ~24% of the UNITE reference
      # (ITS1 bottoms out at 17 bp, ITS2 at 38), which discards genuinely short
      # fungal amplicons — the bias truncLen: c(0,0) exists to avoid. See the ITS page.
      min_len_stat: null
      max_len: null                           # null = no upper length filter (Inf)

    learn_errors:
      nbases: 1e8                             # bases sampled for error model (1e8 = DADA2 default)
      max_consist: 999                        # max EM iterations (999 ≈ unlimited)

    # ── Tier 2: advanced tuning ──
    dada:
      omega_a: 1e-40                          # ASV inference sensitivity (DADA2 default); lower = stricter = fewer ASVs

    merge:
      min_overlap: 12                         # runtime mergePairs threshold in bp = DADA2 default
                                              # (the design constraint is amplicon.min_overlap)
      max_mismatch: 0                         # DADA2 default. Zero is deliberate: after denoising,
                                              # a mismatch in the overlap is evidence the pair should
                                              # not be merged rather than a sequencing error.
      just_concatenate: false                 # joins EVERY pair with an N spacer and never merges on
                                              # overlap — not a selective rescue; see the ITS page
      trim_overhang: true                     # trim bases overhanging amplicon ends; safe for 16S, necessary for short ITS

    chimera:
      method: consensus
      min_fold_parent: 4
      allow_one_off: false                    # DADA2 default. FALSE means STRICTER, not looser: a
                                              # sequence one mismatch/indel away from an exact bimera
                                              # gets flagged as chimeric too, on top of exact matches.
                                              # Setting this true is the relaxed direction — it keeps
                                              # those near-miss sequences instead of removing them.

  # ── Optional 16S phylogeny (stage 85) ─────────────────────────────────────
  # Builds a tree from this run's ASVs so you can compute phylogenetic diversity
  # (Faith's PD, UniFrac) yourself in R. MetaFlux writes the tree and stops there:
  # it computes no diversity statistics, no ordination, no PERMANOVA.
  #
  # The tree is built from the POST-taxonomy ASV set (6.taxonomy/), i.e. after the
  # contaminant filter above. That is deliberate: chloroplast, mitochondrial and
  # off-target ASVs appear in a de novo tree as long branches, which inflate Faith's
  # PD and can invent sample separations in unweighted UniFrac.
  #
  # 16S only. For the other markers a de novo tree is not just untested but
  # contraindicated — ITS is not reliably alignable above genus level, gyrB
  # co-amplifies the parE paralogue, rpoB is mutationally saturated at community
  # scope, and 18S branch lengths from short amplicons are underestimated. Enabling
  # it for another marker is forced off with a warning. See docs/amplicon/phylogeny.md.
  #
  # Threads and memory come from the resources block at the end of this file
  # (resources.threads.phylo_align / phylo_tree / ...), like every other rule.
  # The seed is amplicon.seed above — there is no separate phylogeny seed.
  phylogeny:
    enabled: false                              # opt-in; nothing below runs while this is false
                                                # (with it off, the workflow is identical to one
                                                # built before this module existed)

    backend: iqtree                             # iqtree | fasttree | raxml-ng
                                                # iqtree   — full ML, real model selection available,
                                                #            the default. Minutes on a typical ASV set.
                                                # fasttree — approximate ML, by far the fastest
                                                #            (~93 s at 10,000 ASVs), no model selection.
                                                #            What QIIME 2 and ampliseq use by default.
                                                # raxml-ng — full ML alternative; thread count is
                                                #            clamped to what it recommends for the
                                                #            alignment (it hard-errors on too many).

    aligner_strategy: auto                      # auto | linsi | fftns2   (the aligner itself is
                                                # always MAFFT and is not selectable)
                                                #   auto:   <200 ASVs → L-INS-i; >=200 → FFT-NS-2.
                                                #           That boundary is MAFFT's own documented
                                                #           ceiling for its accuracy strategies.
                                                #   linsi:  force L-INS-i (slow above ~200 sequences)
                                                #   fftns2: force FFT-NS-2 — use this to keep two runs
                                                #           of different sizes directly comparable.
                                                # MAFFT's own --auto is deliberately NOT used: its
                                                # thresholds are unpublished and size-dependent, so
                                                # adding one ASV could silently change the algorithm.
                                                # The resolved choice is written to
                                                # 7.phylogeny/phylogeny.params.json.

    model: auto                                 # auto | an explicit model string for the backend
                                                #   auto → iqtree: GTR+F+G4 | fasttree: gtr | raxml-ng: GTR+G
                                                #
                                                # Why auto pins a model instead of searching: IQ-TREE's
                                                # own default (-m MFP) re-runs ModelFinder on every
                                                # execution, which makes runtime depend on the data.
                                                # On the 16S test data the search picked TPM3u+R5 (real
                                                # ASVs) and GTR+F+I+R5 (reference fragments): a GTR-family
                                                # matrix with FreeRate site rates. The matrix choice barely
                                                # moves the distances diversity metrics use (see the docs),
                                                # so a pinned model is a sound default; IQ-TREE's own advice
                                                # is to select once with MFP and then pin what it picked.
                                                #
                                                # Model SELECTION is still available, and what it picks
                                                # is recorded in phylogeny.params.json:
                                                #   iqtree   "MFP" — ModelFinder
                                                #   raxml-ng "DNA" — MOOSE
                                                #   fasttree       — has no model selection at all;
                                                #                    only "gtr" or "jc" are accepted
                                                #                    (anything else is a hard error,
                                                #                    rather than silently ignored)

    support: false                              # branch support values. Off by default because neither
                                                # UniFrac nor Faith's PD uses them, and computing them
                                                # dominates the runtime.
                                                #   iqtree   → adds -B 1000 --alrt 1000 (ultrafast
                                                #              bootstrap UFBoot and the SH-aLRT branch
                                                #              test; read as UFBoot >= 95 and SH-aLRT
                                                #              >= 80 for a single-gene tree like this one)
                                                #   fasttree → keeps its SH-like local supports
                                                #              (0-1 scale, NOT bootstrap)
                                                #   raxml-ng → not supported; forced off with a warning

    # There is deliberately no rooting option: the tree is exported UNROOTED, only.
    # Faith's PD and UniFrac are root-dependent, and you will prune the tree in R
    # before computing them (decontam against negative controls, abundance filtering
    # of rare ASVs) — any root placed here would stop being valid at the first pruned
    # tip. Root in R, AFTER pruning, immediately before the metric
    # (phangorn::midpoint() or phytools::midpoint.root()).

    extra_args:                                 # advanced escape hatch: appended verbatim to the tool's
                                                # command line and recorded in phylogeny.params.json.
                                                # NOT validated — a flag that contradicts the settings
                                                # above (e.g. -T AUTO) will be passed through and is
                                                # your responsibility. Normally leave these empty.
      mafft: ""
      iqtree: ""
      fasttree: ""
      raxml_ng: ""                              # appended to the --search step only; a --model here is
                                                # ignored by RAxML-NG (the model is fixed at --parse) —
                                                # use `model:` above instead.

# ═══════════════════════════════════════════════════════════════
# Shotgun-only configuration — ignored when mode: amplicon
# ═══════════════════════════════════════════════════════════════
shotgun:
  # Which profiler turns the cleaned reads into taxon tables. The cleaning (PhiX, host,
  # fastp) is the same for all three. See docs/shotgun/sylph.md.
  #   kraken2  Kraken2 + Bracken, exactly as in earlier versions (the default):
  #            03.abundance/otu_table.tsv, read pairs classified per taxon.
  #            Needs references.kraken_db.
  #   sylph    sylph + sylph-tax instead: 03.abundance/sylph_table.tsv, read pairs
  #            ESTIMATED from genome coverage, plus an 'unassigned' row. Needs
  #            references.sylph_databases and sylph_taxonomy_dir. sylph labels no
  #            single read and writes no Kraken2 report, so extract_taxa and
  #            kmer_evidence are switched off.
  #   both     both chains on the same reads, side by side; never merged.
  # To add sylph to a FINISHED Kraken2 run, use a new out_dir with profiler: sylph
  # (MetaFlux stops otherwise and says why).
  profiler: kraken2                           # kraken2 | sylph | both

  decontamination:
    # PhiX is still routinely spiked into Illumina runs — keep this on unless the
    # lab is known to have skipped the spike-in.
    remove_phix: true                         # BBDuk vs bundled phix2.fa.gz; false = skip

    # Host / contaminant removal with BBMap (alignment-based — more sensitive than
    # k-mer matching for host reads that diverge from the reference assembly; this
    # is the BBTools-authors' recommended approach, cf. removehuman.sh).
    # host_genomes: list of local paths and/or URLs to FASTA(.gz) references;
    # multiple entries are concatenated and indexed once. Empty list → skip.
    #
    # For HUMAN, use a MASKED reference — masking ribosomal/low-complexity regions
    # and sequences homologous to microbes/plants/fungi prevents real microbial
    # reads from being falsely removed. A masked human genome (Handley 2020, hg19 +
    # viral masking, 889 MB) is on Zenodo:
    #   https://zenodo.org/records/4116107   →   human_virus_masked.fasta.gz
    # Because it is ~900 MB, download it once to a local path rather than
    # re-fetching the URL on every fresh run.
    host_genomes: []                          # e.g. [/path/to/human_virus_masked.fasta.gz]; [] = skip
    #   - https://zenodo.org/records/4116107/files/human_virus_masked.fasta.gz     # masked human (889 MB) — see docs/shotgun/decontamination.md
    #   - /path/to/human_virus_masked.fasta.gz                                                # local alternative (recommended for repeat runs)
    host_min_id: 0.95                         # BBMap minid — approximate minimum alignment identity for host removal

  fastp:
    min_read_length: 100                      # --length_required after trimming
                                              # 100 is comfortable for 150 bp reads; ~70 for HiSeq 2x100.

  # Kraken2 confidence threshold — higher = stricter.
  # Wright et al. 2023 swept 0.00–1.00 on simulated samples and found two optima,
  # depending on the metric: 0.60 by mean F1, and 0.15 by L1 distance, weighted
  # UniFrac, and recall/precision over the reads actually classified. 0.15 is also
  # what Nyström-Persson et al. 2025 used to benchmark on the CAMI2 datasets.
  # 0.15 (below) favours accurate relative abundances over raw classified counts.
  kraken:
    confidence: 0.15
    hit_groups: 3                             # minimum distinct hit groups per read to keep a classification
    # Two memory-control strategies (only one applies at runtime):
    #   1. mmap on  — kernel pages the DB on demand AND shares pages across
    #                 concurrent kraken2 processes via the OS file cache.
    #                 Parallel jobs do NOT multiply RAM use. Per-process budget
    #                 is fixed at ~20 GB (computed in 00_common.smk).
    #   2. mmap off — each process privately loads the full hash. Per-process
    #                 budget = hash.k2d size + 10% (computed in 00_common.smk).
    memory_mapping: true
    threads: null                             # null = use resources.threads.kraken2; or pin (e.g. 12)

  # Bracken redistributes abundance from Kraken2 reports. Bracken runs only when
  # Kraken2 runs (profiler: kraken2 or both), and only then is tax_lev checked.
  # Target rank: P | C | O | F | G | S (one capital letter). D and K stop the run
  # at start-up: at those ranks Bracken counts the reads of viruses (D) or of
  # protists (K) towards a neighbouring domain or kingdom, and on GTDB it finds no
  # kingdom at all. Drop to G for a shallow DB. The OTU table then has one row per
  # taxon at exactly this rank; the lineage below it is left empty (e.g.
  # ...;g__Bacteroides;s__).
  bracken:
    tax_lev: S

    # Minimum Kraken2 read count for a taxon to take part in the redistribution.
    # This is the single most important accuracy setting in the shotgun path, and it
    # is NOT the stringency knob most people reach for.
    #
    #   auto      derive it from the sample's own sequencing depth (recommended)
    #   <integer> use this fixed count, as Bracken's own default 10 does
    #
    # WHY auto. The right threshold scales with depth: a taxon supported by 50 reads
    # in a 2-million-pair sample is far better evidenced than the same 50 reads in a
    # 15-million-pair one. Benchmarked across a commercial mock (ZymoBIOMICS D6331)
    # and three CAMI II environments (marine, strain-madness, rhizosphere), the best
    # threshold rose in direct proportion to the number of classified read pairs —
    # the fitted exponent was 0.97, i.e. simple proportionality. Any FIXED value
    # therefore gets worse as you sequence deeper: on CAMI marine, species-level F1
    # fell from 0.74 to 0.58 across an 8x depth increase at the fixed default of 10,
    # while a depth-scaled threshold held steady at ~0.83.
    #
    # WHAT auto DOES. After Kraken2 has run, the number of classified read PAIRS is
    # read from the report and the threshold is set to
    #     threshold = max(threshold_min, threshold_alpha * classified_pairs)
    # so it is computed per sample, not per run. The chosen value is written to the
    # bracken log for that sample.
    threshold: auto

    # Scaling coefficient for auto mode. 5e-05 was the best single value across every
    # benchmarked dataset: it costs a mean of 0.023 F1 against tuning each sample
    # individually (median 0.014), because the optimum is a broad plateau rather than
    # a sharp peak. Leaving the threshold at a flat 10 costs up to 0.34 F1. Roughly:
    # 2M pairs -> 100, 5M -> 250, 15M -> 750.
    #
    # A fit on all 41 CAMI II marine, rhizosphere and strain-madness samples, with a
    # newer PlusPF build, puts the median optimum at 6.0e-05, well inside that plateau.
    # See docs/shotgun/confidence-and-threshold.md for the full comparison.
    #
    # Optional refinement if you know your community, though rarely worth the trouble:
    #   3e-05  defined mixtures / low diversity (tens of species)
    #   1e-04  complex communities (100+ species)
    threshold_alpha: 5.0e-05

    # Floor for auto mode, so a very shallow or heavily filtered sample never ends up
    # with a threshold of nearly zero. Also Bracken's own historical default.
    threshold_min: 10

  # ── Species-level k-mer evidence ──────────────────────────────────────────
  # Kraken2's read count says HOW MANY reads hit a taxon. It says nothing about
  # whether they hit the whole genome or piled up on one short conserved stretch
  # shared with a relative. MetaFlux runs Kraken2 with --report-minimizer-data,
  # which adds a count of DISTINCT minimizers per clade — a proxy for how much
  # different sequence the reads actually covered. A real organism has many; a
  # spurious call is usually a few positions matched over and over.
  #
  # This block turns that number into an optional filter that runs BETWEEN
  # Kraken2 and Bracken. It does not replace or skip Bracken: it hands Bracken a
  # cleaned report, so the correction flows into the normal otu_table.
  #
  # ALWAYS WRITTEN, whether enabled or not:
  #   02b.evidence/{sample}_species_evidence.tsv   per-taxon evidence + verdict
  #   02b.evidence/{sample}_report_gated.txt       what the gate would remove
  #   stats/kmer_evidence/{sample}_evidence.png    reads vs distinct minimizers
  # Look at those first. `enabled` only decides whether Bracken reads the gated
  # report or the original one.
  kmer_evidence:
    enabled: false                            # false = report only, pipeline unchanged

    # Distinct-minimizer floor. A taxon below this is removed and its reads are
    # handed back to its parent for Bracken to redistribute among the relatives
    # that passed, rather than deleted. That preserves nearly all of them but not
    # quite all: if EVERY species under a genus fails, Bracken has nowhere at the
    # target rank to send that genus's reads and drops them, usually a small fraction
    # of the sample. Check the per-sample logs for your own data.
    #
    # UNITS — the easy mistake. Published thresholds are in unique K-MERS:
    #   KrakenUniq (Breitwieser & Salzberg 2018): ~2,000 per million reads, or
    #     1,000 for pathogen discovery in patient samples
    #   Refining filtering criteria of the Kraken family (2026): ~1,000 optimal
    #     by F1; read-count filtering "largely unnecessary" when unique k-mers
    #     are high
    #   aMeta (Pochon et al. 2023): ships 1,000 unique k-mers + 200 reads
    # Kraken2's column counts MINIMIZERS, which are a sample of the k-mers. Each
    # k-mer spans w = k - l + 1 candidate minimizers and the expected density of
    # selected ones is 2/(w+1). For the usual k=35, l=31 that is w=5, density
    # 1/3 — about one distinct minimizer per three k-mers. So the published
    # 1,000 k-mers is ~333 here. Using 1,000 directly would make the filter three
    # times harsher than its authors intended.
    # Check k and l on the first line of your database's inspect.txt.
    min_distinct_minimizers: 333

    # Clade-read floor, applied together with the above (a taxon must clear both).
    # aMeta pairs its k-mer filter with 200 reads; Oskolkov 2026 (Front. Microbiol.
    # 17:1603339) found filtering on unique k-mers ALONE was enough to reach the best
    # F1, with no read-count filter needed, so the default here is 0 = k-mer evidence
    # only. Set to e.g. 200 to reproduce aMeta's pair.
    min_reads: 0

    # Safety rail: never remove a taxon to which KRAKEN2 directly assigned more than
    # this share of the sample's classified reads, however thin its evidence looks.
    # 0.01 = 1%. Note the denominator is Kraken2's clade reads over all classified
    # reads — NOT the taxon's share of the final Bracken table, which is usually much
    # larger. So this is a backstop against a pathological case, not a routine
    # override, and it rarely fires. That is deliberate: a rail keyed on post-Bracken
    # abundance would rescue exactly the thinly evidenced taxa that Bracken inflates,
    # which are what the gate exists to remove.
    never_prune_above_fraction: 0.01

  # OTU-table taxon filter — the shotgun counterpart of amplicon.taxonomy.filter.
  # Uses the SAME rank-aware token machinery: each token (d__Bacteria, g__Homo,
  # …) matches a whole slot of the OTU's lineage, d__ k__ p__ c__ o__ f__ g__ s__
  # (d__ is the domain; a virus has its realm there, e.g. d__Duplodnaviria);
  # `keep` runs first, then `discard`. Empty list = that direction does nothing.
  # Applied to the final otu_table after Bracken, so it never changes read
  # classification, only which OTUs appear in the table. Default OFF (metagenomic
  # sample types vary too much for a universal default). Common uses:
  #   keep:    [d__Bacteria, d__Archaea]                # prokaryotes only
  #   keep:    [d__Bacteria, d__Archaea, d__Eukaryota]  # drops viruses and anything
  #                                                     # else without a domain (plasmids)
  #   keep:    [d__Duplodnaviria, d__Riboviria]         # viruses of these realms only
  #   discard: [g__Homo]                                # explicit host safety net
  taxonomy_filter:
    enabled: false
    keep:    []
    discard: []

  # NCBI scientific names of taxa whose reads should be extracted via krakentools.
  # Empty list = skip extraction entirely. Example: [Bacteria, Archaea]
  # Each name must be exactly the name of one row of the sample's Kraken2 report
  # (02.classification/{sample}_report.txt).
  extract_taxa: []

# ─────────────────────── Resources [shared] ─────────────────────
# Per-rule threads and mem_mb. Rules read these via threads_for() / mem_mb_for()
# helpers defined in workflow/rules/shared/00_common.smk. Missing keys fall
# back to threads_default / mem_mb_default — with TWO exceptions: delete the
# phylo_tree or the sylph_sketch line below and that rule falls back to 1, not
# threads_default, because there the thread count changes the result and not just
# the runtime.
resources:
  threads_default: 4
  mem_mb_default: 2000
  threads:
    # ── shared ──
    multiqc: 2
    # ── amplicon ──
    falco: 2
    bowtie2: 8
    cutadapt: 4
    pick_trunclen: 4
    dada_quality_plots: 4
    dada_filter: 4
    dada_seqtab: 8
    dada_length_filter: 2
    target_extract: 8
    assign_taxonomy: 8
    aggregate_read_counts: 2
    # phylogeny (optional, 16S only — see amplicon.phylogeny)
    phylo_input: 1                            # reads two text tables, writes a FASTA
    phylo_align: 4                            # MAFFT
    phylo_tree: 1                             # Applies to the iqtree and raxml-ng backends only.
                                              # ONE thread on purpose, and this is a reproducibility
                                              # setting rather than a performance one. IQ-TREE's search
                                              # visits candidate trees in an order that depends on when
                                              # each thread finishes, so two runs of the SAME alignment
                                              # on several threads can end on different (equally good)
                                              # trees, while on one thread they give the same tree. The
                                              # price is small at amplicon scale: a minute or two for a
                                              # few hundred ASVs. Raise it if you have thousands of ASVs
                                              # and can live with a tree that is not exactly
                                              # reproducible; IQ-TREE parallelises across alignment
                                              # COLUMNS and a 16S alignment is only a few hundred wide,
                                              # so do not expect much above 4. raxml-ng clamps this
                                              # further to what its own --parse step recommends
                                              # (usually 1 for an amplicon alignment; it scales with the
                                              # number of distinct alignment patterns), because it
                                              # terminates when given far too many threads for a short
                                              # alignment. The fasttree backend ignores this key: it is
                                              # pinned single-threaded in the rule, since FastTree's
                                              # parallel binary is documented non-deterministic and the
                                              # serial one is fast enough that there is nothing to gain.
    phylo_export: 1                           # validates the tree, writes the Newick
    phylo_qc: 1                               # reads the tree once for the QC report
    # ── shotgun ──
    decontam_phix: 6
    build_host_index: 16
    decontam_host: 16
    fastp: 16
    kraken2: 16
    kmer_evidence: 1                          # single-threaded text pass over one report
    bracken: 4
    finalize_otu_table: 1                     # one pass over the Bracken reports
    extract_taxon_reads: 4
    compress_extracted: 6                     # pigz parallelism for extract_taxa outputs
    download_sra: 6                           # fasterq-dump parallelism; past ~8 the bottleneck is I/O, not CPU
    # sylph (shotgun.profiler sylph | both)
    sylph_sketch: 1                           # ONE thread on purpose, like phylo_tree. With 2 or more
                                              # threads sylph removes duplicate k-mers in parallel and the
                                              # sketch differs from run to run (Zymo at 8 threads:
                                              # 4,395,232 vs 4,395,237 k-mer counts; abundances moved in
                                              # the 4th decimal). At 1 thread the sketch is byte-identical
                                              # and still fast (~6 s for 4.7 M read pairs); Snakemake
                                              # sketches several samples at once. Delete this line and it
                                              # still falls back to 1.
    sylph_profile: 16                         # one job for ALL samples; no number depends on it
    sylph_taxprof: 1                          # sylph-tax is single-threaded
    sylph_tables: 1
    sylph_read_tracking: 1                    # profiler: sylph only
  mem_mb:
    # ── shared ──
    multiqc: 2000
    # ── amplicon ──
    bowtie2: 4000
    pick_trunclen: 4000
    dada_quality_plots: 4000
    dada_filter: 2000
    dada_seqtab: 16000
    dada_length_filter: 4000
    target_extract: 8000
    assign_taxonomy: 16000
    aggregate_read_counts: 2000
    # phylogeny (optional, 16S only)
    phylo_input: 2000                         # two small text tables -> one FASTA
    phylo_align: 4000
    phylo_tree: 8000                          # Sized for the most demanding backend. Measured/estimated:
                                              # FastTree ~181 MB at 10,000 ASVs; raxml-ng ~3.3 GB at
                                              # 30,000 ASVs by its own formula (it prints an estimate in
                                              # the phylo_tree log, worth checking on your own data);
                                              # IQ-TREE is not separately measured but its likelihood
                                              # vectors scale comparably. Raise this if you enable
                                              # support: true, which was not part of that sizing.
    phylo_export: 2000
    phylo_qc: 2000
    # ── shotgun ──
    decontam_phix: 4000
    build_host_index: 30000                   # BBMap index build for the host reference (masked human ~24-28 GB)
    decontam_host: 30000                      # BBMap mapping vs the host index
    fastp: 8000
    # kraken2 mem_mb is OVERRIDDEN at parse time in 00_common.smk based on
    # shotgun.kraken.memory_mapping + actual hash.k2d size. The value here is
    # an inert fallback used only if KRAKEN_DB is unreadable.
    kraken2: 20000
    kmer_evidence: 2000                       # holds one parsed report in memory (~1-2 MB of text)
    bracken: 4000
    finalize_otu_table: 2000
    extract_taxon_reads: 2000
    # sylph (shotgun.profiler sylph | both)
    sylph_sketch: 4000                        # measured 54-64 MB for 4.7 M read pairs; deep soil
                                              # (0.4-0.5 GB sketches) not measured, hence the headroom
    sylph_profile: null                       # null = worked out at parse time from the database files:
                                              # 1.2 x their size + 4096 MB (GTDB r232 c200 + fungi ->
                                              # 34,601 MB; measured peak 26.9-29.7 GB). Set a number to
                                              # override it, e.g. on a cluster, but not from
                                              # benchmarks/sylph_profile.tsv: after its first ~15-20 s
                                              # Snakemake samples memory only every 30 s, so its max_rss
                                              # misses sylph's peak at the end of the job.
    sylph_taxprof: 2000                       # measured 135 MB
    sylph_tables: 2000
    sylph_read_tracking: 2000
