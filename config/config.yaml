# ═══════════════════════════════════════════════════════════════════════
# MetaFlux v1.0.0 — Unified Illumina 16S/ITS amplicon and shotgun taxonomic profiling workflow
# ═══════════════════════════════════════════════════════════════════════
# TEMPLATE configuration. Replace every `/path/to/...` placeholder with a real path,
# choose a `mode`, and set the references that mode needs. A convenient pattern is to
# copy this file to `config/config.local.yaml` (git-ignored) and run with
# `--configfile config/config.local.yaml`.
#
# All paths can be absolute or relative to the directory snakemake is invoked from.
# Each section is annotated with the mode that consumes it:
#   [shared]   — used by both modes
#   [amplicon] — only used when mode: amplicon
#   [shotgun]  — only used when mode: shotgun

# ─────────────────────── Mode selection ─────────────────────────
# Selects which set of rules runs — amplicon or shotgun (chosen here, not auto-detected).
# Amplicon path requires primer FASTAs (see amplicon.primers); shotgun path
# supports BioProject SRA fetch + arbitrary host genome decontamination.
mode: amplicon # amplicon | shotgun

# ─────────────────────── Input [shared] ─────────────────────────
input:
  # Local FASTQ dir.
  # Amplicon: filenames must match {sample}_R1.fastq.gz / {sample}_R2.fastq.gz.
  # Shotgun:  {sample}_R1/_R2 OR {sample}_1/_2 (SRA-style) — auto-detected.
  fastq_dir: /path/to/fastq_dir
  # BioProject SRA fetch [shotgun-only].
  # Set bioproject to an NCBI BioProject accession (e.g. PRJNA603575) and
  # MetaFlux will resolve PAIRED runs via NCBI e-utils and pull them into
  # fastq_dir via prefetch + fasterq-dump. Leave null to use local FASTQs.
  bioproject: null  # e.g. PRJNA603575
  accession_list: null # optional subset, e.g. [SRR11605259, SRR11605260]

# ─────────────────────── Output [shared] ────────────────────────
output:
  out_dir: /path/to/output_dir

# ─────────────────────── References ─────────────────────────────
# PhiX is used in both modes but consumed differently:
#   amplicon → bowtie2 index built from the fetched FASTA
#   shotgun  → BBDuk's bundled phix174_ill.ref.fa.gz (no download/index needed)
# SILVA / UNITE are amplicon-only and auto-fetched on first run. kraken_db is
# shotgun-only and must be supplied separately.
references:
  phix: # [shared] — only the amplicon path fetches+indexes it
    fasta: refdb/phix/phix.fna
    fetch_url: ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/819/615/GCF_000819615.1_ViralProj14015/GCF_000819615.1_ViralProj14015_genomic.fna.gz
  silva: # [amplicon]
    train:             refdb/silva/silva_nr99_v138.2_toGenus_trainset.fa.gz
    species:           refdb/silva/silva_v138.2_assignSpecies.fa.gz
    sintax:            refdb/silva/silva_nr99_v138.2_sintax.fa.gz # generated by convert_silva_sintax (no download)
    fetch_url_train:   https://zenodo.org/records/14169026/files/silva_nr99_v138.2_toGenus_trainset.fa.gz
    fetch_url_species: https://zenodo.org/records/14169026/files/silva_v138.2_assignSpecies.fa.gz
  unite: # [amplicon]
    fasta:            refdb/unite/sh_general_release_dynamic_s_all_19.02.2025.fasta
    uchime_its1:      refdb/unite/uchime_its1.fasta # pre-extracted ITS1 sequences (UNITE UCHIME release)
    uchime_its2:      refdb/unite/uchime_its2.fasta # pre-extracted ITS2 sequences
    sintax:           refdb/unite/utax_reference_dataset_all_19.02.2025.fasta.gz  # UNITE VSEARCH/SINTAX release
    fetch_url:        https://s3.hpc.ut.ee/plutof-public/original/b02db549-5f04-43fc-afb6-02888b594d10.tgz
    fetch_url_uchime: https://s3.hpc.ut.ee/plutof-public/original/25ff4a97-e637-4d27-a442-9451afb5cbc6.zip
    fetch_url_sintax: https://s3.hpc.ut.ee/plutof-public/original/338a1413-6039-4e00-b5cf-410346a1e366.gz
  kraken_db: /path/to/kraken2_db # [shotgun] — user-supplied (e.g. a PlusPF index)

# ═══════════════════════════════════════════════════════════════
# Amplicon-only configuration — ignored when mode: shotgun
# ═══════════════════════════════════════════════════════════════
amplicon:
  type: 16S                                   # 16S | ITS
  its_region: ITS2                            # ITS1 | ITS2 (ignored if type == 16S)

  decontamination:
    remove_phix: true                         # bowtie2 vs the fetched PhiX reference; false = skip PhiX removal
                                              # (symmetric with shotgun.decontamination.remove_phix)

  primers:
    fwd: /path/to/fwd_primer.fasta
    rev: /path/to/rev_primer.fasta
    orientation: fixed                        # fixed | mixed (mixed enables swap pass in cutadapt)

  expected_length: auto                       # int | [min,max] | "auto"
                                              # 16S auto: in-silico PCR against SILVA; uses probe_length_stat.16S.
                                              # ITS auto: length distribution of UNITE UCHIME ITS1/ITS2 sequences.
                                              # Manual: provide a single integer (bp) or [min, max] range.
  probe_length_stat:
    16S: p95                                  # min | q1 | median | q3 | p95 | p99 | max
                                              # ITS: overlap constraint not checked (truncLen overridden to c(0,0))
  min_overlap: 12                             # design overlap in bp (truncLen constraint AND mergePairs)

  cutadapt:
    max_error_rate: 0.2
    min_length: 50
    # No quality trimming at this stage — DADA2 wants per-cycle Q profiles intact.

  trunc_len:
    mode: manual                              # auto | manual
    q_threshold: 20                           # Q1 (25th-percentile) cutoff for auto
    q_floor: 15                               # floor used by relax_q resolve_policy
    resolve_policy: raise_trunc               # raise_trunc | relax_q | error
    subsample_files: 12                       # number of files sampled by dada2::qa() per direction
    manual_r1: 260                            # used only when mode == manual
    manual_r2: 240
    # Both 16S and ITS use the same Q-based picker + overlap constraint.
    # For ITS, truncLen is overridden to (0, 0) in filterAndTrim — no hard cut
    # is applied; quality is controlled by maxEE and min_len only.
    # NOTE: on very clean runs, `auto` can place truncLen above the (trimmed)
    # read-length bulk and drop all reads — see README Troubleshooting.

  # ASV length filter applied AFTER target extraction (Metaxa2/ITSx) so the
  # filtered distribution is directly comparable to the probe distribution.
  # Auto window: [probe_q1 − window_margin, probe_p95 + window_margin].
  # P95 used (not P99): SILVA/UNITE p99 tails contain anomalously long
  # reference sequences that do not reflect real amplicon lengths.
  length_filter:
    mode: auto                                # auto | manual
    window_margin: 50                         # bp added/subtracted from probe q1 (lower) and p95 (upper)
    range: null                               # [min, max] — overrides auto when set; required when mode=manual

  extraction:
    enabled: true                             # Metaxa2 (16S) or ITSx (ITS); set false to skip

  taxonomy:
    method: sintax                            # rdp | sintax
    min_boot: 80                              # rdp only  — RDP bootstrap minimum (0–100)
    sintax_cutoff: 0.8                        # sintax only — confidence threshold (0–1); 0.8 ≈ min_boot=80
    try_rc: true                              # rdp only  — try reverse complement during assignTaxonomy
    filter:
      enabled: true
      include_pattern: null                   # null → defaults per amplicon type:
                                              #   16S: "k__Archaea|k__Bacteria"
                                              #   ITS: "k__Fungi"
      exclude_pattern: null                   # null → defaults per amplicon type:
                                              #   16S: "chloroplast|mitochondria"
                                              #   ITS: none

  dada2:
    pool: false                               # false | "pseudo" | true

    # ── Tier 1: operational parameters ──
    max_ee: [2, 5]                            # filterAndTrim maxEE [R1, R2]
    trunc_q: 2                                # filterAndTrim truncQ — adaptive 3' trim at first base <= this Q (DADA2 default)
    filter:
      min_len: 50                             # per-read length floor (always used for 16S; fallback for ITS when probe unavailable)
      min_len_stat: q1                        # ITS-only: probe JSON statistic for auto min_len (min|q1|median|q3|p95|p99|max)
      max_len: null                           # null = no upper length filter (Inf)

    learn_errors:
      nbases: 1e8                             # bases sampled for error model (1e8 = DADA2 default)
      max_consist: 999                        # max EM iterations (999 ≈ unlimited)

    # ── Tier 2: advanced tuning ──
    dada:
      omega_a: 1e-40                          # ASV inference sensitivity (DADA2 default); lower = more ASVs

    merge:
      min_overlap: 10                         # runtime mergePairs threshold in bp (design constraint in amplicon.min_overlap)
      max_mismatch: 2
      just_concatenate: false                 # ITS safety valve: skip overlap merging (NNNNN join)
      trim_overhang: true                     # trim bases overhanging amplicon ends; safe for 16S, necessary for short ITS

    chimera:
      method: consensus
      min_fold_parent: 4
      allow_one_off: false                    # accept bimeras with 1 mismatch to parent (relaxed mode)

# ═══════════════════════════════════════════════════════════════
# Shotgun-only configuration — ignored when mode: amplicon
# ═══════════════════════════════════════════════════════════════
shotgun:
  decontamination:
    # PhiX is still routinely spiked into Illumina runs — keep this on unless the
    # lab is known to have skipped the spike-in.
    # NOTE: BBDuk (and the BBMap host step) require uniform-length reads. If the
    # input was adapter/quality-trimmed before deposition (variable lengths), set
    # this false and skip host removal — see README Troubleshooting.
    remove_phix: true                         # BBDuk vs bundled phix174_ill.ref.fa.gz; false = skip

    # Host / contaminant removal with BBMap (alignment-based — more sensitive than
    # k-mer matching for host reads that diverge from the reference assembly; this
    # is the BBTools-authors' recommended approach, cf. removehuman.sh).
    # host_genomes: list of local paths and/or URLs to FASTA(.gz) references;
    # multiple entries are concatenated and indexed once. Empty list → skip.
    #
    # For HUMAN, use a MASKED reference — masking ribosomal/low-complexity regions
    # and sequences homologous to microbes/plants/fungi prevents real microbial
    # reads from being falsely removed. The BBTools-authors' masked human genome
    # (hg19 + viral masking, 889 MB) is on Zenodo:
    #   https://zenodo.org/records/4116107   →   human_virus_masked.fasta.gz
    # Because it is ~900 MB, download it once to a local path rather than
    # re-fetching the URL on every fresh run.
    host_genomes: []                          # e.g. [/path/to/human_virus_masked.fasta.gz]; [] = skip
    #   - https://zenodo.org/records/4116107/files/human_virus_masked.fasta.gz     # masked human (889 MB) — see README
    #   - /path/to/human_virus_masked.fasta.gz                                                # local alternative (recommended for repeat runs)
    host_min_id: 0.95                         # BBMap minid — min alignment identity to call a read host-derived

  fastp:
    min_read_length: 100                      # --length_required after trimming
                                              # 100 is comfortable for 150 bp reads; ~70 for HiSeq 2x100.

  # Kraken2 confidence threshold — 0.1 is moderate; higher = stricter.
  # Hill et al. 2025 (CAMI3) suggests 0.05–0.15 is the sweet spot for PlusPF-like DBs.
  kraken:
    confidence: 0.15
    hit_groups: 3                             # minimum distinct k-mer hits per read to keep a classification
    # Two memory-control strategies (only one applies at runtime):
    #   1. mmap on  — kernel pages the DB on demand AND shares pages across
    #                 concurrent kraken2 processes via the OS file cache.
    #                 Parallel jobs do NOT multiply RAM use. Per-process budget
    #                 is fixed at ~20 GB (computed in 00_common.smk).
    #   2. mmap off — each process privately loads the full hash. Per-process
    #                 budget = hash.k2d size + 10% (computed in 00_common.smk).
    memory_mapping: true
    threads: null                             # null = use resources.threads.kraken2; or pin (e.g. 12)

  # Bracken redistributes abundance from Kraken2 reports.
  # Target rank: D | P | C | O | F | G | S. Drop to G for a shallow DB.
  bracken:
    tax_lev: S
    threshold: 10                             # min read count per taxon

  # NCBI scientific names of taxa whose reads should be extracted via krakentools.
  # Empty list = skip extraction entirely. Example: [Bacteria, Archaea]
  extract_taxa: []

  # SRA fetch (fasterq-dump + pigz) parallelism.
  # 6 is usually enough; past ~8 the bottleneck is I/O rather than CPU.
  download_threads: 6

# ─────────────────────── Resources [shared] ─────────────────────
# Per-rule threads and mem_mb. Rules read these via threads_for() / mem_mb_for()
# helpers defined in workflow/rules/shared/00_common.smk. Missing keys fall
# back to threads_default / mem_mb_default.
resources:
  threads_default: 4
  mem_mb_default: 2000
  threads:
    # ── shared ──
    multiqc: 2
    # ── amplicon ──
    falco: 2
    bowtie2: 8
    cutadapt: 4
    pick_trunclen: 4
    dada_quality_plots: 4
    dada_filter: 4
    dada_seqtab: 8
    dada_length_filter: 2
    target_extract: 8
    assign_taxonomy: 8
    aggregate_read_counts: 2
    # ── shotgun ──
    decontam_phix: 6
    build_host_index: 16
    decontam_host: 16
    fastp: 16
    kraken2: 16
    bracken: 4
    kraken_biom: 2
    extract_taxon_reads: 4
    download_sra: 6
  mem_mb:
    # ── shared ──
    multiqc: 2000
    # ── amplicon ──
    bowtie2: 4000
    pick_trunclen: 4000
    dada_quality_plots: 4000
    dada_filter: 2000
    dada_seqtab: 16000
    dada_length_filter: 4000
    target_extract: 8000
    assign_taxonomy: 16000
    aggregate_read_counts: 2000
    # ── shotgun ──
    decontam_phix: 4000
    build_host_index: 30000                   # BBMap index build for the host reference (masked human ~24-28 GB)
    decontam_host: 30000                      # BBMap mapping vs the host index
    fastp: 8000
    # kraken2 mem_mb is OVERRIDDEN at parse time in 00_common.smk based on
    # shotgun.kraken.memory_mapping + actual hash.k2d size. The value here is
    # an inert fallback used only if KRAKEN_DB is unreadable.
    kraken2: 20000
    bracken: 4000
    kraken_biom: 2000
    extract_taxon_reads: 2000
