# MetaFlux marker pack: 18S rRNA (eukaryotes).
# See 16S.yaml for what belongs in a pack and what does not.
#
# Probed against SILVA-Euk (96-97% in-silico primer recovery vs 66-75% on PR2) but
# classified against PR2, the better-curated eukaryote/protist reference. No target
# region extractor: Metaxa2 could handle SSU but is deliberately not used here, so
# extraction is forced off with a warning.
probe_mode:          pcr
probe_ref:           silva_euk
probe_ref_tag:       silva_euk_18s_v132
probe_stat_key:      18S

taxonomy_refdb:      pr2_dada2        # rdp path
taxonomy_species_db: null             # PR2 carries species in-line; no addSpecies step
taxonomy_sintax_db:  pr2_sintax       # sintax path: PR2's UTAX file with the domain
                                      # moved to d: (rule convert_pr2_sintax)

extractor:           none

# PR2's two release files DISAGREE on rank depth (verified against v5.1.1):
#   dada2 file : 9 ranks  Domain;Supergroup;Division;Subdivision;Class;...;Species
#   UTAX  file : 8 ranks  k:Domain,d:Supergroup,p:Division-Subdivision,c:Class,...
# so the sintax path declares its own model below. Prefixes are keyed to rank
# MEANING, not to the underlying letters. d__, sg__ and c__ ... s__ tokens behave
# the same under either method; dv__ holds the Division under rdp but the joined
# "Division-Subdivision" under sintax, and sbd__ exists under rdp only.
tax_levels:    [Domain, Supergroup, Division, Subdivision, Class, Order, Family, Genus, Species]
rank_letters:  [d, sg, dv, sbd, c, o, f, g, s]     # rdp path: unused
rank_prefixes: [d__, sg__, dv__, sbd__, c__, o__, f__, g__, s__]
prefix_style:  bare

# SINTAX letters are not names for VSEARCH: it reads them as a fixed top-down order
# (d, k, p, c, o, f, g, s) and counts a rank's confidence only over the bootstrap
# rounds that agreed on every rank above it. So the letters must follow the ranks
# top-down: the domain gets d:, the supergroup the next letter, k:, and so on.
# PR2's own UTAX file has the domain under k: and the supergroup under d:, which
# made VSEARCH treat the supergroup as the top rank and lose the domain whenever the
# supergroup was uncertain. MetaFlux therefore classifies against a copy with the
# two letters swapped (rule convert_pr2_sintax). The raw VSEARCH output,
# 6.taxonomy/_sintax_raw.tsv, shows the supergroup as k:<supergroup>; the tables
# write it as sg__ / Supergroup.
sintax_tax_levels:    [Domain, Supergroup, Division_Subdivision, Class, Order, Family, Genus, Species]
sintax_rank_letters:  [d, k, p, c, o, f, g, s]
sintax_rank_prefixes: [d__, sg__, dv__, c__, o__, f__, g__, s__]

# What the PR2 files must hold, checked header by header before any classification
# (rule check_taxonomy_reference; see 16S.yaml for the rule format). The rules apply
# to the file of the active method: the DADA2 file (rdp) or the domain-first SINTAX
# file (sintax), which both start with the domain and the supergroup. PR2's domain
# rank also carries its organelle tags (Eukaryota:plas for plastids, :mito, :nucl,
# :apic, :chro). Together the two rules catch PR2's own UTAX file pinned in place of
# the domain-first copy: it uses the same letters, but holds the supergroups under
# d:, which this pack reads as the domain, and the domain under k:.
reference_values:
  Domain:     {one_of: [Eukaryota, Bacteria, Archaea, "Eukaryota:plas", "Eukaryota:mito",
                        "Eukaryota:nucl", "Eukaryota:apic", "Eukaryota:chro"]}
  Supergroup: {not_one_of: [Eukaryota, Bacteria, Archaea, "Eukaryota:plas", "Eukaryota:mito",
                            "Eukaryota:nucl", "Eukaryota:apic", "Eukaryota:chro"]}

# See 16S.yaml. The three downloads are plain files, so their fetch rules are
# generated; the fourth file, pr2_sintax, is derived from pr2_utax by rule
# convert_pr2_sintax (10_refdb.smk) and therefore has no url.
references:
  silva_euk:
    file: silva_euk/silva_132.18s.dada2.fa.gz
    url:  https://zenodo.org/records/1447330/files/silva_132.18s.99_rep_set.dada2.fa.gz?download=1
  pr2_dada2:
    file: pr2/pr2_SSU_dada2.fasta.gz
    url:  https://github.com/pr2database/pr2database/releases/download/v5.1.1/pr2_version_5.1.1_SSU_dada2.fasta.gz
  pr2_utax:
    file: pr2/pr2_SSU_UTAX.fasta.gz
    url:  https://github.com/pr2database/pr2database/releases/download/v5.1.1/pr2_version_5.1.1_SSU_UTAX.fasta.gz
  pr2_sintax:
    file: pr2/pr2_SSU_UTAX_domain-first.fasta.gz
