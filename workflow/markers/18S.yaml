# MetaFlux marker pack: 18S rRNA (eukaryotes).
# See 16S.yaml for what belongs in a pack and what does not.
#
# Probed against SILVA-Euk (96-97% in-silico primer recovery vs 66-75% on PR2) but
# classified against PR2, the better-curated eukaryote/protist reference. No target
# region extractor: Metaxa2 could handle SSU but is deliberately not used here, so
# extraction is forced off with a warning.
probe_mode:          pcr
probe_ref:           silva_euk
probe_ref_tag:       silva_euk_18s_v132
probe_stat_key:      18S

taxonomy_refdb:      pr2_dada2        # rdp path
taxonomy_species_db: null             # PR2 carries species in-line; no addSpecies step
taxonomy_sintax_db:  pr2_utax         # sintax path

extractor:           none

# PR2's two release files DISAGREE on rank depth (verified against v5.1.1):
#   dada2 file : 9 ranks  Domain;Supergroup;Division;Subdivision;Class;...;Species
#   UTAX  file : 8 ranks  k:Domain,d:Supergroup,p:Division-Subdivision,c:Class,...
# so the sintax path declares its own model below. Prefixes are keyed to rank
# MEANING, not to the underlying letters, so one keep/discard token behaves the
# same under either method (d__Eukaryota works for both).
tax_levels:    [Domain, Supergroup, Division, Subdivision, Class, Order, Family, Genus, Species]
rank_letters:  [d, sg, dv, sbd, c, o, f, g, s]     # rdp path: unused
rank_prefixes: [d__, sg__, dv__, sbd__, c__, o__, f__, g__, s__]
prefix_style:  bare

sintax_tax_levels:    [Domain, Supergroup, Division_Subdivision, Class, Order, Family, Genus, Species]
sintax_rank_letters:  [k, d, p, c, o, f, g, s]
sintax_rank_prefixes: [d__, sg__, dv__, c__, o__, f__, g__, s__]

# See 16S.yaml. All three 18S references are plain downloads, so this marker needs
# no fetch code at all.
references:
  silva_euk:
    file: silva_euk/silva_132.18s.dada2.fa.gz
    url:  https://zenodo.org/records/1447330/files/silva_132.18s.99_rep_set.dada2.fa.gz?download=1
  pr2_dada2:
    file: pr2/pr2_SSU_dada2.fasta.gz
    url:  https://github.com/pr2database/pr2database/releases/download/v5.1.1/pr2_version_5.1.1_SSU_dada2.fasta.gz
  pr2_utax:
    file: pr2/pr2_SSU_UTAX.fasta.gz
    url:  https://github.com/pr2database/pr2database/releases/download/v5.1.1/pr2_version_5.1.1_SSU_UTAX.fasta.gz
