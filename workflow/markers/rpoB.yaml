# MetaFlux marker pack: rpoB (bacterial RNA polymerase subunit B).
# See 16S.yaml for what belongs in a pack and what does not.
#
# Protein-coding single-copy marker (Ogier et al. 2019); resolves species that
# 16S V3-V4 cannot. Reference is the FROGS RefSeq build (complete + chromosome
# genomes, FetchMGS-extracted, 47k sequences). Unlike gyrB's DD7RZ8, these are
# FULL-LENGTH rpoB genes (~4 kb), so:
#   - probe_mode: pcr  — in-silico PCR of the primers recovers the amplicon body
#     from the full gene (a direct read would return the whole gene, wrong).
#   - no region extractor — there is no rpoB equivalent of Metaxa2/ITSx.
probe_mode:          pcr
probe_ref:           rpob_frogs
probe_ref_tag:       rpob_refseq_cc_20240707
probe_stat_key:      rpoB             # amplicon.probe_length_stat.rpoB feeds auto mode
# Leave out of the length statistics every in-silico product that still holds a
# second full-length forward-primer site (40a_amplicon_probe.py, pass 3). In many of
# these genes the forward primer also fits, with as many mismatches as the probe
# allows, a look-alike stretch upstream of its real site, and cutadapt then starts the
# product there. With the Univ_rpoB_deg primers that is 7,289 of the 42,995 products
# (17%), starting about 920 bp too early; they put p95 at 1,332 bp. Without them p95
# is 395 bp (median 386 bp), close to the 387 bp the amplicon has between the primers.
probe_exclude_second_site: true

# rdp path only. The FROGS package is for its own classifier; MetaFlux uses the
# converted FASTA with DADA2 assignTaxonomy. There is no SINTAX build, so
# taxonomy.method must be rdp for rpoB.
taxonomy_refdb:      rpob_frogs
taxonomy_species_db: null             # no separate species step; the trainset goes to species
taxonomy_sintax_db:  null             # no SINTAX build for this reference

extractor:           none

# Rank model. After conversion (10_refdb.smk convert_rpob_to_dada2) the header is
#   >d__Bacteria;p__Phylum;c__Class;o__Order;f__Family;g__Genus;s__Genus_species
# an NCBI RefSeq lineage with ranks already prefixed and a binomial species —
# the same seven slots as 16S on SILVA 138.2. "embedded" = emit values verbatim.
#
# The first rank is the domain. FROGS writes it under k__ (k__Bacteria), but this
# release carries NCBI's taxonomy as it was when FROGS built it (July 2024), before
# NCBI added kingdoms for prokaryotes, so every lineage has a domain and no kingdom.
# In MetaFlux's amplicon tables d__ is the domain (16S, 18S) and k__ the kingdom rank
# (16S on SILVA 144, ITS), so the converter (refdb/frogs_rpob_to_dada2.py) rewrites
# k__Bacteria to d__Bacteria and stops on any other first rank, and this pack names
# the rank Domain, with the prefix d__. The pack and the converted file must change
# together: the best-hit check of the discard filter compares whole tokens
# (d__Bacteria) with the names in the file (see rank_prefixes below).
tax_levels:    [Domain, Phylum, Class, Order, Family, Genus, Species]
rank_letters:  [d, p, c, o, f, g, s]              # SINTAX codes — unused (rdp-only)
# rank_prefixes: under embedded style the taxonomy strings keep the names exactly as
# the reference writes them, so these prefixes are never added to them. They are
# still used, so they must match the reference's own prefixes: the reference check
# (rule check_taxonomy_reference) stops the run before classification when a name
# does not start with its rank's prefix (the converted file of an older MetaFlux,
# with k__Bacteria, stops there), the best-hit check of the discard filter finds the
# rank of a token by its prefix (d__Bacteria -> Domain), and 80a writes the
# per-rank cells of taxon_seq_table.txt without them.
rank_prefixes: [d__, p__, c__, o__, f__, g__, s__]
prefix_style:  embedded

# What the converted file must hold, checked header by header before any
# classification (rule check_taxonomy_reference; see 16S.yaml for the rule format).
# This FROGS release holds bacteria only, so every lineage starts with the domain
# Bacteria.
reference_values:
  Domain: {one_of: [Bacteria]}

# The FROGS download is a .tar.gz bundling a FASTA, a BLAST index and an RDP tree,
# with FROGS-specific headers (>ACC Root;k__X [id: N];...). It needs extraction AND a
# header transform to become a DADA2 trainset, so — like UNITE and silva_sintax — it
# keeps bespoke rules in 10_refdb.smk (fetch_rpob_archive + convert_rpob_to_dada2)
# rather than a generated fetch. `archive: tgz` marks it so, and `file` is the
# CONVERTED output path. "domain-d" in its name marks the file that writes the
# domain as d__: a refdb folder shared with an older MetaFlux checkout keeps that
# checkout's own converted file (rpob_refseq_cc_20240707_dada2.fa.gz, domain as
# k__), and each checkout reads the file that matches its pack.
references:
  rpob_frogs:
    archive: tgz
    file: rpob/rpob_refseq_cc_20240707_domain-d_dada2.fa.gz
    url:  https://web-genobioinfo.toulouse.inrae.fr/frogs_databanks/assignation/rpoB/rpoB_bacteria_NCBI_refseq_genome_complete_and_chromosome_20240707.tar.gz
